services:
  - type: web
    name: statintel-ml-backend
    env: python
    buildCommand: pip install -r ml_backend/requirements.txt
    startCommand: cd ml_backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 5000
    healthCheckPath: /health

  - type: web
    name: statintel-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
