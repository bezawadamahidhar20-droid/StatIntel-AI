version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statintel-backend-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/statintel_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=statintel_production_secret_key_32bytes_min!
      - USE_MOCK_AI=False
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg16
    container_name: statintel-db-pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: statintel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: statintel-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
